name: Pabrik Reels Horor

on:
  # Tombol manual "Run workflow" di tab Actions
  workflow_dispatch:
    inputs:
      mode:
        description: "uji = buat video saja (tidak diposting), posting = langsung posting ke Page"
        required: true
        default: "uji"
        type: choice
        options:
          - uji
          - posting
  # JADWAL OTOMATIS (waktu GitHub = UTC, WIB = UTC + 7)
  # Berapa slot yang benar-benar posting diatur variabel POST_PER_HARI (bawaan: 2).
  # JADWAL OTOMATIS HOROR (waktu GitHub = UTC, WIB = UTC + 7)
  # Berapa slot yang benar-benar posting diatur variabel POST_PER_HARI_HOROR (bawaan: 0 = mati).
  # Bot mulai ~10 menit sebelum jam tayang.
  schedule:
    - cron: "20 14 * * *"  # slot 1: tayang ~21:30 WIB (malam, puncak horor)
    - cron: "5 16 * * *"   # slot 2: tayang ~23:15 WIB (larut malam)
    - cron: "50 11 * * *"  # slot 3: tayang ~19:00 WIB (setelah Magrib)
    - cron: "50 5 * * *"   # slot 4: tayang ~13:00 WIB (siang)

permissions:
  contents: write

concurrency:
  group: pabrik-reels-horor
  cancel-in-progress: false

jobs:
  buat-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cek jatah posting hari ini
        id: jatah
        env:
          JADWAL: ${{ github.event.schedule }}
          BATAS: ${{ vars.POST_PER_HARI_HOROR }}
        run: |
          BATAS="${BATAS:-0}"
          case "$JADWAL" in
            "20 14 * * *") SLOT=1 ;;
            "5 16 * * *")  SLOT=2 ;;
            "50 11 * * *") SLOT=3 ;;
            "50 5 * * *")  SLOT=4 ;;
            *)             SLOT=0 ;;   # dijalankan manual
          esac
          if [ "$SLOT" -le "$BATAS" ]; then
            echo "jalan=ya" >> "$GITHUB_OUTPUT"
            echo "Slot $SLOT, batas $BATAS per hari: JALAN"
          else
            echo "jalan=tidak" >> "$GITHUB_OUTPUT"
            echo "Slot $SLOT melebihi batas $BATAS per hari: dilewati"
          fi

      - name: Ambil isi gudang
        if: steps.jatah.outputs.jalan == 'ya'
        uses: actions/checkout@v4

      - name: Siapkan Python
        if: steps.jatah.outputs.jalan == 'ya'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang alat (ffmpeg, font, suara, penyelaras subtitle)
        if: steps.jatah.outputs.jalan == 'ya'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests pillow numpy edge-tts faster-whisper

      - name: Jalankan kantor virtual AI
        if: steps.jatah.outputs.jalan == 'ya'
        env:
          MODE: ${{ github.event.inputs.mode || 'posting' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_HOROR || secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_HOROR || secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_HOROR || secrets.CF_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_HOROR }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_HOROR }}
          NICHE: horor
          LOGO: logo_horor.png
          NAMA_PAGE: ${{ vars.NAMA_PAGE_HOROR }}
          WATERMARK: ${{ vars.WATERMARK_HOROR }}
          MESIN_SUARA: ${{ vars.MESIN_SUARA }}
          SUARA_GEMINI: ${{ vars.SUARA_GEMINI_HOROR || 'Charon' }}
          SUARA: ${{ vars.SUARA }}
          MODEL_WHISPER: ${{ vars.MODEL_WHISPER }}
        run: python pabrik.py

      - name: Simpan hasil untuk dicek
        if: always() && steps.jatah.outputs.jalan == 'ya'
        uses: actions/upload-artifact@v4
        with:
          name: hasil-reels-horor
          path: |
            hasil/video_final.mp4
            hasil/caption.txt
            hasil/naskah.json
          retention-days: 2
          if-no-files-found: ignore

      - name: Catat riwayat judul (supaya tidak mengulang kisah)
        if: success() && steps.jatah.outputs.jalan == 'ya'
        run: |
          if [ -f riwayat_horor.json ] && [ -n "$(git status --porcelain riwayat_horor.json)" ]; then
            git config user.name "pabrik-reels-bot"
            git config user.email "bot@users.noreply.github.com"
            git add riwayat_horor.json
            git commit -m "Catat riwayat Reels horor"
            git pull --rebase -q || true
            git push
          fi
