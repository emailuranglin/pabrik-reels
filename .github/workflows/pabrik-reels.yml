name: Pabrik Reels

on:
  # Tombol manual "Run workflow" di tab Actions
  workflow_dispatch:
    inputs:
      mode:
        description: "uji = buat video saja (tidak diposting), posting = langsung posting ke Page"
        required: true
        default: "uji"
        type: choice
        options:
          - uji
          - posting
  # JADWAL OTOMATIS (waktu GitHub = UTC, WIB = UTC + 7)
  # Berapa slot yang benar-benar posting diatur variabel POST_PER_HARI (bawaan: 2).
  schedule:
    # Bot mulai ~10 menit sebelum target, karena membuat video butuh waktu.
    - cron: "5 13 * * *"   # slot 1: mulai 20:05, tayang ~20:15 WIB (santai malam setelah Isya)
    - cron: "5 10 * * *"   # slot 2: mulai 17:05, tayang ~17:15 WIB (sore, pulang kerja)
    - cron: "35 4 * * *"   # slot 3: mulai 11:35, tayang ~11:45 WIB (istirahat siang)
    - cron: "5 0 * * *"    # slot 4: mulai 07:05, tayang ~07:15 WIB (pagi, berangkat kerja)
    - cron: "35 14 * * *"  # slot 5: mulai 21:35, tayang ~21:45 WIB (sebelum tidur)
    - cron: "5 8 * * *"    # slot 6: mulai 15:05, tayang ~15:15 WIB (sore)

permissions:
  contents: write

concurrency:
  group: pabrik-reels
  cancel-in-progress: false

jobs:
  buat-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cek jatah posting hari ini
        id: jatah
        env:
          JADWAL: ${{ github.event.schedule }}
          BATAS: ${{ vars.POST_PER_HARI }}
        run: |
          BATAS="${BATAS:-2}"
          case "$JADWAL" in
            "5 13 * * *")  SLOT=1 ;;
            "5 10 * * *")  SLOT=2 ;;
            "35 4 * * *")  SLOT=3 ;;
            "5 0 * * *")   SLOT=4 ;;
            "35 14 * * *") SLOT=5 ;;
            "5 8 * * *")   SLOT=6 ;;
            *)            SLOT=0 ;;   # dijalankan manual
          esac
          if [ "$SLOT" -le "$BATAS" ]; then
            echo "jalan=ya" >> "$GITHUB_OUTPUT"
            echo "Slot $SLOT, batas $BATAS per hari: JALAN"
          else
            echo "jalan=tidak" >> "$GITHUB_OUTPUT"
            echo "Slot $SLOT melebihi batas $BATAS per hari: dilewati"
          fi

      - name: Ambil isi gudang
        if: steps.jatah.outputs.jalan == 'ya'
        uses: actions/checkout@v4

      - name: Siapkan Python
        if: steps.jatah.outputs.jalan == 'ya'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang alat (ffmpeg, font, edge-tts)
        if: steps.jatah.outputs.jalan == 'ya'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests pillow edge-tts

      - name: Jalankan kantor virtual AI
        if: steps.jatah.outputs.jalan == 'ya'
        env:
          MODE: ${{ github.event.inputs.mode || 'posting' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          NAMA_PAGE: ${{ vars.NAMA_PAGE }}
          MESIN_SUARA: ${{ vars.MESIN_SUARA }}
          SUARA_GEMINI: ${{ vars.SUARA_GEMINI }}
          SUARA: ${{ vars.SUARA }}
        run: python pabrik.py

      - name: Simpan hasil untuk dicek
        if: always() && steps.jatah.outputs.jalan == 'ya'
        uses: actions/upload-artifact@v4
        with:
          name: hasil-reels
          path: |
            hasil/video_final.mp4
            hasil/caption.txt
            hasil/naskah.json
          retention-days: 2
          if-no-files-found: ignore

      - name: Catat riwayat judul (supaya tidak mengulang kisah)
        if: success() && steps.jatah.outputs.jalan == 'ya'
        run: |
          if [ -f riwayat.json ] && [ -n "$(git status --porcelain riwayat.json)" ]; then
            git config user.name "pabrik-reels-bot"
            git config user.email "bot@users.noreply.github.com"
            git add riwayat.json
            git commit -m "Catat riwayat Reels"
            git pull --rebase -q || true
            git push
          fi
